<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sileo</title>
<style>
:root{--bg:#fff;--card:#f2f2f7;--tx:#111;--sub:#8a8a8e;--sep:#e3e3e8;--tint:#2fa9c9;--btn:#35b6c8;--bar:rgba(250,250,252,.86);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#2a2a2d;--tx:#f5f5f7;--sub:#8e8e93;--sep:#2c2c2e;--tint:#7b9bf7;--btn:#7b9bf7;--bar:rgba(22,22,24,.86);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#2a2a2d;--tx:#f5f5f7;--sub:#8e8e93;--sep:#2c2c2e;--tint:#7b9bf7;--btn:#7b9bf7;--bar:rgba(22,22,24,.86);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden}
#head{display:flex;align-items:center;justify-content:center;height:46px;font-weight:600;font-size:17px;position:relative;flex:none}
#head svg{position:absolute;right:14px;width:30px;height:30px}
#view{flex:1;overflow-y:auto;padding:0 0 100px}
.ban{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 4px}
.ban img{width:78%;max-width:320px;aspect-ratio:378/213;object-fit:cover;border-radius:12px;scroll-snap-align:start;flex:none;cursor:pointer}
h2{font-size:24px;margin:20px 16px 4px;letter-spacing:-.3px}
.row{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer}
.row img{width:64px;height:64px;border-radius:15px;object-fit:cover;flex:none}
.mid{flex:1;min-width:0;padding:6px 0;border-bottom:.5px solid var(--sep);margin:-10px 0;padding:14px 0;display:flex;align-items:center;gap:10px}
.row:last-child .mid{border:0}
.txt{flex:1;min-width:0}.txt b{display:block;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--sub);font-size:14px}.txt .sub{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.get{border:0;background:var(--btn);color:#fff;font-weight:700;border-radius:99px;padding:8px 20px;font-size:16px;min-width:84px}
.get.q{background:var(--card);color:var(--tint)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 16px 0}
.btn{border:0;background:var(--card);color:var(--tint);font-size:17px;font-weight:500;border-radius:12px;padding:18px}
.full{grid-column:1/-1}.foot{text-align:center;color:var(--sub);font-size:13px;margin:16px 0 8px;line-height:1.5}
.search{width:calc(100% - 32px);margin:8px 16px;border:0;border-radius:10px;background:var(--card);color:var(--tx);padding:10px 12px;font-size:16px;outline:none}
.seg{display:flex;margin:10px 16px;background:var(--card);border-radius:9px;padding:2px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:7px;border-radius:7px;font-size:14px;font-weight:600}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
#tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bar);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-top:.5px solid var(--sep);padding:7px 0 calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;border:0;background:none;color:var(--sub);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs svg{width:28px;height:28px;fill:currentColor}#tabs .s{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--tint)}
.badge{position:absolute;top:-2px;left:56%;background:#ff3b30;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;font-style:normal}
#queue{position:absolute;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--btn);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:16px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#sheet{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px)}
#sheet.open{display:flex}
.top{display:flex;align-items:center;padding:10px 12px;flex:none}.top button{border:0;background:none;color:var(--tint);font-size:17px}
#sbody{flex:1;overflow-y:auto;padding-bottom:30px}
.big{display:flex;gap:16px;align-items:center;padding:16px}.big img{width:80px;height:80px;border-radius:18px;object-fit:cover}
.big .txt b{font-size:24px}
.hbanner{width:100%;display:block}
.tabs2{display:flex;border-bottom:.5px solid var(--sep)}.tabs2 span{flex:1;text-align:center;padding:10px;color:var(--sub);font-weight:600}.tabs2 .on{color:var(--tint);border-bottom:2px solid var(--tint)}
.pad{padding:16px;line-height:1.45}
.info{display:flex;justify-content:space-between;padding:11px 16px;border-bottom:.5px solid var(--sep);font-size:15px}.info span:first-child{color:var(--sub)}
.act{display:block;width:calc(100% - 32px);margin:8px 16px;border:0;background:var(--btn);color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:17px}.act.sec{background:var(--card);color:var(--tint)}
pre{background:#0c0c0e;color:#d7ffd2;border-radius:12px;padding:12px;margin:12px 16px;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;min-height:200px}
.pb{height:6px;border-radius:9px;background:var(--sep);overflow:hidden;margin:10px 16px}.pb i{display:block;height:100%;width:0;background:var(--btn);transition:width .3s}
.empty{text-align:center;color:var(--sub);padding:50px 20px}
</style></head><body>
<div id="app"><div id="head"></div><div id="view"></div><button id="queue"></button><nav id="tabs"></nav>
<div id="sheet"><div class="top"><button id="back">‹ Back</button></div><div id="sbody"></div></div></div>

const RU={havoc:'havoc.app',chariz:'repo.chariz.com',dynastic:'repo.dynastic.co',bigboss:'apt.thebigboss.org',procursus:'apt.procurs.us'};
// [name,author,ver,repo,price,icon,desc,banner]
const P=[
['Sential Basic','Alessandro Chiarlitti','1.0','dynastic','Free','sential','Clean, minimal icon pack for the Home Screen.'],
['Slicey','RyanY','1.1','bigboss','Free','slicey','Slice your Home Screen into a custom grid.','b_slicey'],

['BetterSettings','MidnightChips','0.1.0','dynastic','Free','bettersettings','Quick toggles right inside Settings.','b_bettersettings'],
['Felicity','XenDesign','2.7','bigboss','Free','felicity','Colorful icon themes with a fresh feel.','b_felicity'],
['Ultrasound','AppleSetax','1.1.1','dynastic','Free','ultrasound','Fine-tune the sound of your device.'],
['HomeGesture','MidnightChips','2.0.6','dynastic','Free','homegesture','Home bar gestures for any iPhone.'],
['Mojito','Unkue Inc.','2.0.2','chariz','Free','mojito','Fresh icons and wallpapers for iOS.','b_mojito'],

['Flora','rosiepie','1.1.3','havoc','$1.49','flora','Beautiful, calming icon pack.'],
['HALO','uzro','2.4','havoc','$2.99','halo','Glowing, rounded icons with a cute twist.'],

['CarBridge','leftyfl1p','2.0.15','havoc','$9.99','carbridge','Run any app on CarPlay.'],
['Crane','opa334','1.3.16-4','havoc','$4.99','crane','Run apps in separate containers.'],

['SwipeExtenderX','qwertyuiop1379','1.5.3-1','chariz','Free','swipeextender','Swipe on the keyboard to move the cursor.'],
['SnowBoard','Spark','1.0','bigboss','Free','snowboard','Theme icons across the whole system. Choose a theme and apply it in one tap.','b_snowboard'],
['Sileo','Sileo Team','2.5.1','procursus','Free','sileo','A modern APT package manager frontend.']
].map(a=>({n:a[0],a:a[1],v:a[2],r:a[3],p:a[4],i:I[a[5]],d:a[6],b:a[7]?I[a[7]]:null}));
const by=n=>P.find(p=>p.n===n),grp=(...ns)=>ns.map(by);
const ST={tab:'featured',q:'',seg:'Installed',queue:[],inst:new Set(['Felicity','Ultrasound','Sileo','SnowBoard']),detail:null};
const sv=d=>`<svg viewBox="0 0 28 28">${d}</svg>`;
const ICON={featured:sv('<path d="m14 3 3.4 7 7.6 1-5.600 5.300 1.500 7.700L14 20.300 7.100 24l1.500-7.700L3 11l7.600-1z"/>'),
news:sv('<path class="s" d="M7 5h13a2 2 0 0 1 2 2v15H8a3 3 0 0 1-3-3V7"/><path class="s" d="M10 10h8M10 14h8M10 18h5"/>'),
sources:sv('<circle class="s" cx="14" cy="14" r="10"/><path class="s" d="M4 14h20M14 4c-4 4-4 16 0 20M14 4c4 4 4 16 0 20"/>'),
packages:sv('<path class="s" d="M7 5h13a2 2 0 0 1 2 2v15H8a3 3 0 0 1-3-3V7"/><rect x="10" y="9" width="8" height="6" rx="1"/>'),
search:sv('<circle class="s" cx="12" cy="12" r="7"/><path class="s" d="m17.500 17.500 6 6"/>')};
const TABS=[['featured','Featured'],['news','New'],['sources','Sources'],['packages','Packages'],['search','Search']];
const $=s=>document.querySelector(s),view=$('#view'),sheet=$('#sheet'),sb=$('#sbody');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pill(p){const q=ST.queue.includes(p.n),i=ST.inst.has(p.n);return `<button class="get ${q?'q':''}" data-get="${esc(p.n)}">${q?'Queued':i?'Modify':p.p==='Free'?'Get':p.p}</button>`}
function row(p,sub){return `<div class="row" data-open="${esc(p.n)}"><img src="${p.i}" alt=""><div class="mid"><div class="txt"><b>${esc(p.n)}</b><span class="sub">${esc(sub||p.a)}</span><span class="sub">${esc(p.v)} · ${R[p.r]}</span></div>${pill(p)}</div></div>`}
const list=(l,s)=>l.map(p=>row(p,s)).join('');
function render(){
 $('#head').innerHTML=({featured:'Featured',news:'New',sources:'Sources',packages:'Packages',search:'Search'})[ST.tab]+(ST.tab==='featured'?'<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#1b6fe0" opacity=".16" stroke="#2f7cf0" stroke-width="1.5"/><circle cx="15" cy="12" r="4.500" fill="#2f7cf0"/><path d="M6.500 25c1-5 4-7 8.500-7s7.500 2 8.500 7" fill="#2f7cf0"/></svg>':'');
 $('#tabs').innerHTML=TABS.map(t=>`<button class="${ST.tab===t[0]?'on':''}" data-tab="${t[0]}">${ICON[t[0]]}<span>${t[1]}</span>${t[0]==='packages'&&ST.queue.length?`<i class="badge">${ST.queue.length}</i>`:''}</button>`).join('');
 const qb=$('#queue');qb.style.display=ST.queue.length?'block':'none';qb.textContent=`Queue · ${ST.queue.length} package${ST.queue.length>1?'s':''}`;
 let h='';
 if(ST.tab==='featured'){
  h=`<div class="ban">${['SnowBoard','Slicey','Mojito','Felicity','BetterSettings'].map(n=>`<img src="${by(n).b}" data-open="${n}" alt="${n}">`).join('')}</div>
  <h2>Popular Packages</h2>${list(P.slice(0,5))}<h2>Recent Packages</h2>${list(P.slice(5,10))}
  <h2>What We're Using</h2>${list(P.slice(10,19))}
  <div class="btns"><button class="btn">Twitter</button><button class="btn">Website</button><button class="btn full">Support</button></div>
  <div class="foot">iPhone15,2 • iOS 18.0 • Sileo 2.5.1<br>Procursus</div>`;
 }else if(ST.tab==='news'){h=`<h2>Recently Updated</h2>${list(P.slice(5,12).reverse())}`}
 else if(ST.tab==='sources'){
  h=`<div style="margin-top:8px">${Object.keys(R).map(k=>`<div class="row" data-repo="${k}"><img src="${I[({havoc:'flora',chariz:'jade',dynastic:'sential',bigboss:'snowboard',procursus:'sileo'})[k]]}" alt=""><div class="mid"><div class="txt"><b>${R[k]}</b><span class="sub">${RU[k]}</span></div><span class="sub">${P.filter(p=>p.r===k).length} ›</span></div></div>`).join('')}</div><div class="foot">${Object.keys(R).length} Sources · ${P.length} Packages</div>`;
 }else if(ST.tab==='packages'){
  const l=ST.seg==='Installed'?P.filter(p=>ST.inst.has(p.n)):P.filter(p=>ST.inst.has(p.n)&&p.n!=='Sileo').slice(0,2);
  h=`<div class="seg">${['Installed','Changes'].map(s=>`<button class="${ST.seg===s?'on':''}" data-seg="${s}">${s}</button>`).join('')}</div>`+
   (ST.seg==='Changes'&&ST.queue.length?`<h2>Queued</h2>${list(ST.queue.map(by))}`:'')+
   (ST.seg==='Changes'?`<h2>Updates Available</h2>`:'')+
   (l.length?list(l,ST.seg==='Changes'?'Update available':null):'<div class="empty">Nothing here yet.</div>');
 }else{
  h=`<input class="search" id="sq" placeholder="Packages, sources, developers" value="${esc(ST.q)}"><div id="res">${res()}</div>`;
 }
 const st=view.scrollTop;view.innerHTML=h;view.scrollTop=st;
 const sq=$('#sq');if(sq)sq.oninput=e=>{ST.q=e.target.value;$('#res').innerHTML=res()};
}
function res(){const l=P.filter(p=>(p.n+p.a+p.d+R[p.r]).toLowerCase().includes(ST.q.toLowerCase()));return l.length?list(l):'<div class="empty">No results.</div>'}
function openPkg(n){const p=by(n);ST.detail=n;const q=ST.queue.includes(n),i=ST.inst.has(n);
 sb.innerHTML=(p.b?`<img class="hbanner" src="${p.b}" alt="">`:'')+`<div class="big"><img src="${p.i}" alt=""><div class="txt"><b>${esc(p.n)}</b><span class="sub" style="font-size:17px">${esc(p.a)}</span></div>${pill(p)}</div>
 <div class="tabs2"><span class="on">Details</span><span>Changelog</span></div><div class="pad">${esc(p.d)}</div>
 <div class="info"><span>Version</span><span>${esc(p.v)}</span></div><div class="info"><span>Source</span><span>${R[p.r]}</span></div><div class="info"><span>Price</span><span>${p.p}</span></div>
 ${i?`<button class="act sec" data-get="${esc(n)}">${q?'Cancel removal':'Remove'}</button>`:''}`;
 sheet.classList.add('open')}
function openRepo(k){ST.detail=null;sb.innerHTML=`<div class="big"><div class="txt"><b>${R[k]}</b><span class="sub">${RU[k]}</span></div></div>${list(P.filter(p=>p.r===k))}`;sheet.classList.add('open')}
function toggle(n){const i=ST.queue.indexOf(n);i>=0?ST.queue.splice(i,1):ST.queue.push(n);render();if(ST.detail)openPkg(ST.detail)}
function confirmQ(){const it=[...ST.queue];ST.detail=null;
 sb.innerHTML=`<h2>Confirm</h2>${it.map(n=>`<div class="info"><span>${ST.inst.has(n)?'Remove':'Install'}</span><span>${esc(n)}</span></div>`).join('')}<button class="act" id="go" style="margin-top:20px">Confirm</button><button class="act sec" id="cancel">Cancel</button>`;
 sheet.classList.add('open');$('#cancel').onclick=()=>sheet.classList.remove('open');$('#go').onclick=()=>run(it)}
function run(it){
 sb.innerHTML=`<h2>Queue</h2><div class="pb"><i id="bar"></i></div><pre id="log"></pre><button class="act" id="done" style="display:none">Done</button>`;
 const lg=[];it.forEach(n=>{const p=by(n),rm=ST.inst.has(n);lg.push(rm?`Removing ${n} ...`:`Get:1 https://${RU[p.r]} ${p.n} ${p.v}`,rm?'(Reading database ... done)':`Unpacking ${n} (${p.v}) ...`,rm?`Removed ${n}.`:`Setting up ${n} (${p.v}) ...`)});lg.push('','Done.');
 let i=0;const t=setInterval(()=>{$('#log').textContent+=lg[i]+'\n';$('#bar').style.width=Math.round(++i/lg.length*100)+'%';
  if(i>=lg.length){clearInterval(t);it.forEach(n=>ST.inst.has(n)?ST.inst.delete(n):ST.inst.add(n));ST.queue=[];$('#done').style.display='block';$('#done').onclick=()=>{sheet.classList.remove('open');render()}}},400)}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-get]');if(g){e.stopPropagation();toggle(g.dataset.get);return}
 const o=e.target.closest('[data-open]');if(o){openPkg(o.dataset.open);return}
 const r=e.target.closest('[data-repo]');if(r){openRepo(r.dataset.repo);return}
 const t=e.target.closest('[data-tab]');if(t){ST.tab=t.dataset.tab;render();return}
 const s=e.target.closest('[data-seg]');if(s){ST.seg=s.dataset.seg;render();return}
 if(e.target.closest('#queue')){confirmQ();return}
 if(e.target.closest('#back')){sheet.classList.remove('open');ST.detail=null;render()}
});
render();
</script></body></html>
